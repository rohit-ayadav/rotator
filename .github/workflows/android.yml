name: Android CI Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Package & Name APK Artifact
        id: package_apk
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            cp app/build/outputs/apk/debug/app-debug.apk "dist/Rotator-${VERSION}.apk"
            echo "apk_path=dist/Rotator-${VERSION}.apk" >> $GITHUB_OUTPUT
            echo "apk_name=Rotator-${VERSION}.apk" >> $GITHUB_OUTPUT
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/Rotator-debug.apk"
            echo "apk_path=dist/Rotator-debug.apk" >> $GITHUB_OUTPUT
            echo "apk_name=Rotator-debug.apk" >> $GITHUB_OUTPUT
          fi
          ls -la dist/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rotator-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Rotator ${{ github.ref_name }}"
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
